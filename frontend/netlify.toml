# Netlify: set "Base directory" to frontend. VITE_API_URL must point at the
# backend (e.g. https://api.marianaparfumes.uz) in the site's environment.
[build]
  command = "pnpm build"
  publish = "dist"

# Vue Router uses HTML5 history: serve index.html for every page URL.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
